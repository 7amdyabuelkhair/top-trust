name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Debug build output
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== .output ==="
          find .output -maxdepth 4 -type f 2>/dev/null | head -100
          echo "=== DIST ==="
          find dist -maxdepth 4 -type f 2>/dev/null | head -100

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy
        uses: actions/deploy-pages@v4
